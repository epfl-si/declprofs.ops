---
- name: Create database credentials secret
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ app-n8n.name }}-db-credentials"
        namespace: "{{ inventory_hostname }}"
        labels:
          app.kubernetes.io/name: "{{ app-n8n.name }}"
          app.kubernetes.io/component: database
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      stringData:
        username: "{{ database.n8n.user }}"
        password: "{{ secrets.database.n8n.password }}"
        database: "{{ database.n8n.name }}"

- name: Create application secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ app-n8n.name }}-secrets"
        namespace: "{{ inventory_hostname }}"
      type: Opaque
      stringData:
        DB_TYPE: postgresdb
        DB_POSTGRESDB_HOST: postgres-cluster-rw
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: "{{ app-n8n.name }}-db"
        DB_POSTGRESDB_USER: "{{ app-n8n.name }}-user"
        DB_POSTGRESDB_PASSWORD: "{{ secrets.database.n8n.password }}"
        N8N_HOST: "{{ app-n8n.url }}"
        N8N_PORT: "5678"
        N8N_ENCRYPTION_KEY: "{{ secrets.key }}"
        N8N_PROTOCOL: https
        WEBHOOK_URL: "{{ app-n8n.url }}/"
        N8N_USER_FOLDER: /home/node/.n8n
        GENERIC_TIMEZONE: Europe/Paris
        TZ: Europe/Paris
        N8N_LOG_LEVEL: info
