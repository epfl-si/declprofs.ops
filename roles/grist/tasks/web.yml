---
- name: Create web Service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ app.name }}-grist"
        namespace: "{{ inventory_hostname }}"
        labels:
          app.kubernetes.io/name: "{{ app.name }}"
          app.kubernetes.io/component: grist
      spec:
        selector:
          app.kubernetes.io/name: "{{ app.name }}"
          app.kubernetes.io/component: grist
        ports:
          - name: http
            protocol: TCP
            port: 80
            targetPort: http

- name: Create web Route
  kubernetes.core.k8s:
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ app.name }}-grist"
        namespace: "{{ inventory_hostname }}"
        labels:
          app.kubernetes.io/name: "{{ app.name }}"
          app.kubernetes.io/component: grist
          route: private
      spec:
        host: "{{ app.domain }}"
        to:
          kind: Service
          name: "{{ app.name }}-grist"
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

- name: Deploy grist application
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ app.name }}-grist"
        namespace: "{{ inventory_hostname }}"
        labels:
          app.kubernetes.io/name: "{{ app.name }}"
          app.kubernetes.io/component: grist
      spec:
        replicas: "{{ resources.grist.replicas }}"
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ app.name }}"
            app.kubernetes.io/component: grist
        template:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ app.name }}"
              app.kubernetes.io/component: grist
          spec:
            containers:
              - name: grist
                image: "{{ registry }}/grist:{{ images.grist.version }}"
                imagePullPolicy: Always
                ports:
                  - containerPort: 8484
                    name: http
                envFrom:
                  - secretRef:
                      name: "{{ app.name }}-grist-secrets"
                resources:
                  requests:
                    cpu: "{{ resources.grist.requests.cpu }}"
                    memory: "{{ resources.grist.requests.memory }}"
                  limits:
                    memory: "{{ resources.grist.limits.memory }}"
                readinessProbe:
                  tcpSocket:
                    port: 8484
                  initialDelaySeconds: 20
                  periodSeconds: 10
                livenessProbe:
                  tcpSocket:
                    port: 8484
                  initialDelaySeconds: 20
                  periodSeconds: 30
                volumeMounts:
                  - name: data
                    mountPath: /persist
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: "{{ app.name }}-grist-storage"
            imagePullSecrets:
              - name: "{{ pull_secret }}"
